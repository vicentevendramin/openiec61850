[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "openiec61850"
version = "0.1.0"
description = "Clean-room IEC 61850 implementation with a high-performance native core"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Networking",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.25"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/openiec61850"]

[tool.scikit-build.cmake.define]
OPENIEC61850_BUILD_PYTHON = "ON"
OPENIEC61850_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *_i686"
test-extras = ["test"]
test-command = "pytest {project}/tests/python"

[tool.cibuildwheel.linux]
before-all = "yum install -y zip unzip curl tar git && git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg && /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics"
environment = { VCPKG_ROOT = "/opt/vcpkg" }
