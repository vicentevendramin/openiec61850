# Public checks for pull requests on the GitHub mirror (ADR 0006). The full CI (sanitizers,
# fuzzing, benchmarks, libiec61850 interop) runs on the homelab GitLab; this workflow only gives
# external contributors fast feedback: build + C++ tests + Python tests on Linux, and the same
# Python build on macOS and Windows, which do not block a release (ADR 0008).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite"

jobs:
  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Install vcpkg (manifest baseline)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build > /dev/null
          mkdir -p .cache/vcpkg
          bash packaging/cibuildwheel/install-vcpkg.sh "$RUNNER_TEMP/vcpkg"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset release -DOPENIEC61850_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset release
      - name: Test (includes the install-tree consumer test)
        run: ctest --preset release -j4

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: vcpkg-py-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-py-${{ runner.os }}-
      - name: Install vcpkg (manifest baseline)
        run: |
          mkdir -p .cache/vcpkg
          bash packaging/cibuildwheel/install-vcpkg.sh "$RUNNER_TEMP/vcpkg"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          OPENIEC61850_REQUIRE_TESTING: "1"
        run: |
          python -m pip install -q ".[test]" -Ccmake.define.OPENIEC61850_BUILD_PYTHON_TESTING=ON
          python -m pytest -q

  portable:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: vcpkg-py-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-py-${{ runner.os }}-
      - name: Install vcpkg (manifest baseline)
        shell: bash
        run: |
          mkdir -p .cache/vcpkg
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            bash packaging/cibuildwheel/install-vcpkg.sh "$RUNNER_TEMP/vcpkg"
            echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          fi
      # Keeps going after a failure and turns the first compiler errors into annotations, which
      # can be read without opening the log.
      - name: Build
        shell: bash
        run: |
          status=0
          keep_going=()
          [[ "$RUNNER_OS" == Windows ]] || keep_going=(-Cbuild.tool-args=-k0)  # Ninja only
          python -m pip install -v ".[test]" "${keep_going[@]}" \
            -Ccmake.define.OPENIEC61850_BUILD_PYTHON_TESTING=ON > build.log 2>&1 || status=$?
          # One error per file: annotations are capped at ten per step.
          { grep -E '(fatal )?error( [A-Z]+[0-9]+)?:|CMake Error|Could NOT find|Undefined symbols|^ *ld: |FAILED:' build.log || true; } \
            | awk '{k=$0; sub(/[(:][0-9]+.*/, "", k); if (!seen[k]++) print}' | head -n 10 \
            | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done
          tail -n 40 build.log
          exit "${status}"
      - name: Test
        env:
          OPENIEC61850_REQUIRE_TESTING: "1"
        run: python -m pytest -q
