# Main CI pipeline (ADR 0006). Runs on the homelab GitLab instance.
# The runner has 6 cores and 4 GB of RAM: resource_group runs the heavy jobs one at a time, also
# across pipelines, so that C++ builds never compete for memory.
stages: [build, test, analysis, interop, package]

variables:
  VCPKG_ROOT: /opt/vcpkg
  VCPKG_COMMIT: a073c28e52d920cb2465a17512324b3b6684d03a
  VCPKG_DEFAULT_BINARY_CACHE: $CI_PROJECT_DIR/.cache/vcpkg
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

default:
  image: ubuntu:24.04
  cache:
    key: vcpkg-$VCPKG_COMMIT
    paths: [.cache/vcpkg]
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
        build-essential clang clang-tools lld cmake ninja-build git curl zip unzip tar pkg-config
        python3 python3-venv python3-dev > /dev/null
    - mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
    - git clone -q https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
    - git -C "$VCPKG_ROOT" checkout -q "$VCPKG_COMMIT"
    - "$VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics"

build:gcc:
  stage: build
  resource_group: homelab-runner
  script:
    - cmake --preset release -DOPENIEC61850_WARNINGS_AS_ERRORS=ON
    - cmake --build --preset release
    - ctest --preset release
  artifacts:
    when: always
    reports:
      junit: build/release/junit.xml

test:asan-ubsan:
  stage: test
  resource_group: homelab-runner
  variables:
    CXX: clang++
    ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
    UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  script:
    - cmake --preset asan
    - cmake --build --preset asan
    - ctest --preset asan

test:tsan:
  stage: test
  resource_group: homelab-runner
  variables:
    CXX: clang++
    TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
  script:
    - cmake --preset tsan
    - cmake --build --preset tsan
    - ctest --preset tsan

test:python:
  stage: test
  resource_group: homelab-runner
  variables:
    # Fail instead of skipping when the fake-server extension is missing.
    OPENIEC61850_REQUIRE_TESTING: "1"
  script:
    # The oldest supported Python: the wheels job covers the newer ones.
    - python3 -m venv .uv && .uv/bin/pip install -q uv
    - .uv/bin/uv venv -q --seed --python 3.10 .venv
    - .venv/bin/pip install -q ".[test]" -Ccmake.define.OPENIEC61850_BUILD_PYTHON_TESTING=ON
    - .venv/bin/pytest

analysis:fuzz-smoke:
  stage: analysis
  resource_group: homelab-runner
  variables:
    FUZZ_SECONDS: "60"
  script:
    - cmake --preset fuzz
    - cmake --build --preset fuzz
    - |
      for f in $(find build/fuzz/fuzz -type f -executable -name 'fuzz_*'); do
        name=$(basename "$f"); corpus="fuzz/corpus/${name#fuzz_}"
        mkdir -p "$corpus"
        echo "== $name"; "$f" -max_total_time="$FUZZ_SECONDS" "$corpus"
      done

package:wheels:
  stage: package
  resource_group: homelab-runner
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  tags: [docker]
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io > /dev/null
    - python3 -m venv .venv && .venv/bin/pip install -q cibuildwheel
    - .venv/bin/cibuildwheel --platform linux --output-dir wheelhouse
  artifacts:
    paths: [wheelhouse/]

# Google Benchmark suite (benchmarks/, GLOSSARY "Reference benchmark"). Smoke run on every
# pipeline (short min time: catches crashes and fixture errors, not regressions); the JSON is kept
# as an artifact. Reference numbers are recorded on a quiet machine, see docs/guides/contributing.md.
analysis:bench-smoke:
  stage: analysis
  resource_group: homelab-runner
  script:
    - cmake --preset bench
    - cmake --build --preset bench
    - mkdir -p bench-results
    - build/bench/benchmarks/openiec61850_bench --benchmark_min_time=0.01s
        --benchmark_out_format=json --benchmark_out=bench-results/smoke.json
  artifacts:
    when: always
    paths: [bench-results/]

# Interoperability with libiec61850, run as binaries (ADR 0001, 0007), in both directions: our
# client (interop/runner) against its example servers, and its example clients (interop/clients)
# against the openiec61850-server tool. Needs Docker on the runner and the homelab infrastructure
# (ADR 0006): only for the default branch (manual on other branches of this project), never for
# external contributions.
interop:libiec61850:
  stage: interop
  resource_group: homelab-runner
  image: docker:27
  tags: [docker]
  allow_failure: true  # until the suite has been stable for a while
  timeout: 1h
  cache: []
  services:
    - name: docker:27-dind
      alias: docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push"
      when: manual
  variables:
    LIBIEC61850_VERSION: "1.6.0"
    INTEROP_TIMEOUT: "5"
    CLIENT_TIMEOUT: "8"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash > /dev/null
    - docker info > /dev/null
  script:
    - interop/run.sh

# Documentation site (mkdocs.yml), published from the default branch.
pages:
  stage: package
  image: python:3.12-slim
  needs: []
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script: []
  script:
    - pip install -q mkdocs==1.6.1
    - cp GLOSSARY.md docs/glossary.md
    - cp CHANGELOG.md docs/changelog.md
    - mkdocs build
  pages:
    publish: public
